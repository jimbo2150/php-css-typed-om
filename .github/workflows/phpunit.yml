name: PHPUnit

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: Validate composer.json
        run: composer validate --strict
      - name: Check code style
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Run static analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress
      - name: Lint benchmarks script
        run: php -l benchmarks/bench.php
      - name: Run benchmark smoke test
        run: |
          set -o pipefail
          XDEBUG_MODE=off php -d opcache.enable_cli=1 benchmarks/bench.php --iterations=1 --warmup=0 --json | php -r '$d = json_decode(stream_get_contents(STDIN), true); if (!is_array($d) || ($d["meta"]["opcache_cli"] ?? null) !== "on" || empty($d["benchmarks"])) { exit(1); }'
          XDEBUG_MODE=off php -d opcache.enable_cli=1 benchmarks/bench.php --iterations=1 --warmup=0 > /dev/null
      - name: Run tests
        run: ./vendor/bin/phpunit --colors=never
